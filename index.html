<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>FlyMusic</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>FlyMusic</header>

  <main>
    <canvas id="brain" aria-label="FlyWire brain map"></canvas>
    <canvas id="roll" aria-label="Piano roll"></canvas>
  </main>

  <footer>
    <div class="tempo" role="group" aria-label="Tempo">
      <button class="tempo-button" type="button" data-bpm="84" aria-pressed="true">ANDANTE</button>
      <button class="tempo-button" type="button" data-bpm="112" aria-pressed="false">MODERATO</button>
    </div>
    <div class="transport">
      <button id="play" type="button">PLAY</button>
      <button id="stop" type="button">STOP</button>
    </div>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
